<!--
  The "Choose a file" control of /grade/import/csv/index.php, cut from the page
  a real run captured on 2026-09-09 against course 14707 (Moodle 4.x, Boost,
  site language French). The session key in the original <noscript> is replaced
  by REDACTED; nothing else is edited.

  Kept because this is core Moodle's `filepicker` *form element*, whose choose
  control is an <input type="button"> carrying `fp-btn-choose` itself — not
  Atto's <div class="fp-btn-choose"><a>. A selector written for one does not
  match the other, and reading that off a live page costs an attended session.
-->
